<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelZone</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
        }

        header {
            padding: 40px 20px;
            background: #2563eb;
        }

        h1 {
            font-size: 45px;
            margin: 0;
        }

        .contenido {
            padding: 30px;
        }

        .tarjetas {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .tarjeta {
            background: #1f2937;
            padding: 25px;
            border-radius: 15px;
            width: 220px;
        }

        .tarjeta h2 {
            color: #60a5fa;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>🎨 PixelZone</h1>
    <p>Tu zona para crear, editar y disfrutar contenido digital</p>
</header>

<div class="contenido">
    <h2>¿Qué puedes hacer?</h2>

    <div class="tarjetas">

        <div class="tarjeta">
            <h2>🖼️ Fondos</h2>
            <p>Fondos de pantalla para tu celular o computadora.</p>
            <button>Ver fondos</button>
        </div>

        <div class="tarjeta">
            <h2>🎬 Videos</h2>
            <p>Encuentra y crea contenido en video.</p>
            <button>Ver videos</button>
        </div>

        <div class="tarjeta">
            <h2>📸 Editor</h2>
            <p>Edita tus fotos y crea diseños.</p>
            <button>Editar fotos</button>
        </div>

        <div class="tarjeta">
            <h2>✨ Más</h2>
            <p>Próximamente tendremos más herramientas.</p>
            <button>Explorar</button>
        </div>

    </div>
</div>

</body>
</html>
